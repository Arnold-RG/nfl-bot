<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open NFLBot</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #05050f;
      color: #e8eefc;
      font-family: system-ui, sans-serif;
      text-align: center;
      padding: 24px;
    }
    a {
      color: #6c9bff;
      font-weight: 700;
    }
  </style>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var watch = params.get("watch") || params.get("pair") || "";
      var origin = window.location.origin;
      var next = watch
        ? origin + "/?watch=" + encodeURIComponent(watch) + "#/watch"
        : origin + "/";
      window.location.replace(next);
    })();
  </script>
</head>
<body>
  <main>
    <p>Opening NFLBot…</p>
    <p><a href="/">Continue to the app</a></p>
  </main>
</body>
</html>
