name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Stub local secrets for public build
        run: cp lib/config/local_secrets.example.dart lib/config/local_secrets.dart
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
