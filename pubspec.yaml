name: nfbot_app
description: NFLBot - AI-powered nutrition, fitness & body wellness app
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.0.0
  dio: ^5.4.0
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.1.0
  pedometer: ^4.0.2
  image_picker: ^1.0.7
  fl_chart: ^0.68.0
  intl: ^0.19.0
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  local_auth: ^2.3.0
  shared_preferences: ^2.3.0
  permission_handler: ^11.3.1
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
